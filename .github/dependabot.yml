version: 2
updates:
  # pnpm dependencies - STRICT MODE: patch updates only
  # Note: GitHub Dependabot doesn't support pnpm ecosystem yet, use npm with pnpm-lock.yaml
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "monthly"
      day: "monday"
    open-pull-requests-limit: 3
    reviewers:
      - "Mostafa-SAID7"
    labels:
      - "dependencies"
      - "type: maintenance"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Block ALL minor and major updates except security patches
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  # GitHub Actions - STRICT MODE: patch updates only
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "ci"
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
