name: Deploy to Vercel

on:
  workflow_dispatch:  # Manual trigger only - auto-deploy disabled

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.17.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-esm-v1-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-esm-v1-

      - name: Install dependencies
        run: |
          rm -rf node_modules
          pnpm install --frozen-lockfile

      - name: Build project
        run: pnpm build

      - name: Verify build output
        run: |
          test -d dist/shoftv-landing || (echo "ERROR: dist/shoftv-landing not found" && exit 1)
          test -f dist/shoftv-landing/index.html || (echo "ERROR: index.html not found" && exit 1)
          echo "✓ Build verified for deployment"

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Create Vercel Build Output API v3 structure
        run: |
          mkdir -p .vercel/output/static
          mkdir -p .vercel/output/functions
          cp -r dist/shoftv-landing/* .vercel/output/static/
          cat > .vercel/output/config.json << 'EOF'
          {
            "version": 3,
            "routes": [
              {
                "src": "^/(?!.*\\.).*$",
                "dest": "/index.html"
              },
              {
                "src": "/assets/(.*)",
                "headers": {
                  "cache-control": "public, max-age=31536000, immutable"
                }
              },
              {
                "handle": "filesystem"
              }
            ]
          }
          EOF
          echo "✓ Build Output API v3 structure created"

      - name: Create Vercel project config
        run: |
          cat > .vercel/project.json << EOF
          {
            "orgId": "${{ secrets.VERCEL_ORG_ID }}",
            "projectId": "${{ secrets.VERCEL_PROJECT_ID }}"
          }
          EOF

      - name: Deploy to Vercel
        run: |
          vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }} --yes > deployment-url.txt
          cat deployment-url.txt
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
