name: Build & Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Display environment
        run: |
          node --version
          npm --version
          echo "Node cache will be used for npm ci"

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Build project
        run: npm run build

      - name: Verify build output
        run: |
          test -d dist/shoftv-landing || (echo "ERROR: dist/shoftv-landing not found" && exit 1)
          test -f dist/shoftv-landing/index.html || (echo "ERROR: dist/shoftv-landing/index.html not found" && exit 1)
          echo "✓ Build output verified"

      - name: Run tests
        run: npm test -- --watch=false
        env:
          CI: true

      - name: Run security audit
        run: npm audit --audit-level=moderate || true

      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: shof-tv-build
          path: dist/shoftv-landing/
          retention-days: 7
          if-no-files-found: error
